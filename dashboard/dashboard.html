<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MicroBot</title>
<style>
  :root{--bg:#0b0e14;--card:#141922;--line:#232a36;--txt:#e6e9ef;--mut:#8b94a7}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:32px;max-width:900px;margin:0 auto}
  header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:24px}
  h1{font-size:18px;font-weight:600}h1 span{color:var(--mut);font-weight:400}
  #upd{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
  .k{color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .v{font-size:26px;font-weight:600;margin-top:4px}.v small{font-size:13px;color:var(--mut)}
  section{margin-bottom:20px}
  h2{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
  ul{list-style:none}
  .row{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-bottom:6px;display:flex;gap:14px;font-size:14px}
  .row time{color:var(--mut);flex-shrink:0;font-size:12px;padding-top:2px}
  .empty{color:var(--mut);font-size:13px}
  pre{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:12px;overflow-x:auto;color:#9aa4b8;white-space:pre-wrap;word-break:break-word}
  footer{margin-top:8px;color:var(--mut);font-size:12px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>MicroBot <span>/ dashboard</span></h1>
  <span id="upd"></span>
</header>

<div class="grid">
  <div class="card"><div class="k">CPU</div><div class="v" id="cpu">&ndash;</div></div>
  <div class="card"><div class="k">RAM</div><div class="v" id="ram">&ndash;</div></div>
  <div class="card"><div class="k">Disco</div><div class="v" id="disk">&ndash;</div></div>
  <div class="card"><div class="k">Temp</div><div class="v" id="temp">&ndash;</div></div>
</div>

<div class="grid">
  <div class="card"><div class="k">Hechos aprendidos</div><div class="v" id="n_facts">&ndash;</div></div>
  <div class="card"><div class="k">Conversaciones</div><div class="v" id="n_history">&ndash;</div></div>
  <div class="card"><div class="k">Errores</div><div class="v" id="n_errors">&ndash;</div></div>
  <div class="card"><div class="k">Skills</div><div class="v" id="n_skills">&ndash;</div></div>
</div>

<section><h2>Ultimos hechos</h2><ul id="facts"><li class="empty">cargando...</li></ul></section>
<section><h2>Errores recientes</h2><ul id="errors"><li class="empty">cargando...</li></ul></section>
<section><h2>Log del bot</h2><pre id="log">&ndash;</pre></section>

<footer>MicroBot &middot; datos reales de SQLite y /proc</footer>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[<>&]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;"}[c]));
const cut = ts => esc(String(ts || "").slice(5, 16));

async function refresh(){
  try{
    const s = await (await fetch("/api/stats")).json();
    $("cpu").textContent = s.cpu != null ? s.cpu + "%" : "-";
    $("ram").textContent = s.ram != null ? s.ram + "%" : "-";
    $("disk").textContent = s.disk != null ? s.disk + "%" : "-";
    $("temp").innerHTML = s.temp != null ? s.temp + "<small>&deg;C</small>" : "-";
    $("upd").textContent = "actualizado " + new Date().toLocaleTimeString();
  }catch(e){}

  try{
    const b = await (await fetch("/api/bot")).json();
    $("n_facts").textContent = b.facts;
    $("n_history").textContent = b.history;
    $("n_errors").textContent = b.errors;
    $("n_skills").textContent = b.skills;
    $("facts").innerHTML = b.recent_facts.length
      ? b.recent_facts.map(f => `<li class="row"><time>${cut(f.ts)}</time>${esc(f.text)}</li>`).join("")
      : `<li class="empty">sin hechos todavia</li>`;
    $("errors").innerHTML = b.recent_errors.length
      ? b.recent_errors.map(e => `<li class="row"><time>${cut(e.ts)}</time><span>${esc(e.ctx)}: ${esc(e.err)}</span></li>`).join("")
      : `<li class="empty">sin errores registrados</li>`;
    $("log").textContent = (b.log || []).join("");
  }catch(e){}
}

refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
